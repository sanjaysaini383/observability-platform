name: Feature request
description: Suggest an improvement or a new capability for TraceLens.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Dashboard (React)
        - Query API
        - Kafka consumer
        - AI trace analyser
        - Demo services (api-gateway, order, payment, inventory, notification)
        - OTel Collector / Kafka / ClickHouse / docker-compose
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is harder than it should be?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would approach it. Point at the files or endpoints involved if you know them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How a reviewer can tell it's done.
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
